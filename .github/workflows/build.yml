name: Build Aimlock Dylib for FreeFire iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    env:
      DEVELOPER_DIR: /Applications/Xcode_14.3.1.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          brew install clang-format
          brew install yq

      - name: Create Source Directory
        run: mkdir -p Sources

      - name: Write Aimlock Source Code
        run: |
          cat > Sources/Aimlock.m << 'EOF'
          #import <Foundation/Foundation.h>
          #import <mach/mach.h>
          #import <mach/vm_map.h>
          #import <dlfcn.h>
          #import <pthread.h>

          typedef struct {
              uint64_t address;
              uint32_t offset;
              float x;
              float y;
              float z;
          } PlayerBone;

          typedef struct {
              uint64_t baseAddress;
              float viewMatrix[16];
              float cameraPosition[3];
              PlayerBone bones[32];
              int boneCount;
          } PlayerData;

          static PlayerData players[64];
          static int playerCount = 0;
          static uint64_t gameBaseAddress = 0;
          static mach_port_t taskPort = MACH_PORT_NULL;

          vm_offset_t readMemory(uint64_t address, size_t size) {
              vm_offset_t data = 0;
              mach_msg_type_number_t dataCount = 0;
              kern_return_t kr = vm_read_overwrite(taskPort, address, size, (vm_address_t)&data, &dataCount);
              if (kr != KERN_SUCCESS) {
                  return 0;
              }
              return data;
          }

          void writeMemory(uint64_t address, void *data, size_t size) {
              kern_return_t kr = vm_write(taskPort, address, (vm_offset_t)data, (mach_msg_type_number_t)size);
              if (kr != KERN_SUCCESS) {
                  return;
              }
          }

          uint64_t getBaseAddress() {
              if (gameBaseAddress != 0) {
                  return gameBaseAddress;
              }
              struct kinfo_proc info;
              size_t infoSize = sizeof(info);
              int mib[4] = {CTL_KERN, KERN_PROC, KERN_PROC_PID, getpid()};
              if (sysctl(mib, 4, &info, &infoSize, NULL, 0) == 0) {
                  gameBaseAddress = (uint64_t)info.kp_proc.p_comm;
              }
              Dl_info dlInfo;
              if (dladdr((const void *)readMemory, &dlInfo)) {
                  gameBaseAddress = (uint64_t)dlInfo.dli_fbase;
              }
              if (gameBaseAddress == 0) {
                  gameBaseAddress = 0x100000000;
              }
              return gameBaseAddress;
          }

          void scanPlayers() {
              playerCount = 0;
              uint64_t base = getBaseAddress();
              uint64_t entityList = base + 0x2A8B6C0;
              uint64_t entityListPtr = readMemory(entityList, 8);
              if (entityListPtr == 0) {
                  return;
              }
              for (int i = 0; i < 64; i++) {
                  uint64_t playerPtr = readMemory(entityListPtr + (i * 8), 8);
                  if (playerPtr == 0) {
                      continue;
                  }
                  uint64_t boneManager = readMemory(playerPtr + 0x150, 8);
                  if (boneManager == 0) {
                      continue;
                  }
                  uint64_t boneArray = readMemory(boneManager + 0x20, 8);
                  if (boneArray == 0) {
                      continue;
                  }
                  float x = 0.0f, y = 0.0f, z = 0.0f;
                  uint32_t boneCount = readMemory(boneManager + 0x28, 4);
                  if (boneCount > 32) {
                      boneCount = 32;
                  }
                  for (int j = 0; j < boneCount; j++) {
                      PlayerBone bone;
                      bone.address = boneArray + (j * 0x30);
                      bone.offset = j;
                      float *boneData = (float *)readMemory(bone.address + 0x10, 12);
                      if (boneData != NULL) {
                          bone.x = boneData[0];
                          bone.y = boneData[1];
                          bone.z = boneData[2];
                      }
                      players[playerCount].bones[j] = bone;
                  }
                  players[playerCount].boneCount = boneCount;
                  players[playerCount].baseAddress = playerPtr;
                  playerCount++;
                  if (playerCount >= 64) {
                      break;
                  }
              }
          }

          void aimLock() {
              scanPlayers();
              if (playerCount == 0) {
                  return;
              }
              uint64_t base = getBaseAddress();
              uint64_t viewMatrixPtr = base + 0x2B8C4A0;
              float *viewMatrix = (float *)readMemory(viewMatrixPtr, 64);
              if (viewMatrix == NULL) {
                  return;
              }
              float targetX = 0.0f, targetY = 0.0f, targetZ = 0.0f;
              int targetIndex = -1;
              float minDistance = 999999.0f;
              for (int i = 0; i < playerCount; i++) {
                  if (players[i].boneCount == 0) {
                      continue;
                  }
                  float headX = players[i].bones[0].x;
                  float headY = players[i].bones[0].y;
                  float headZ = players[i].bones[0].z;
                  if (headX == 0.0f && headY == 0.0f && headZ == 0.0f) {
                      continue;
                  }
                  float dist = sqrtf((headX * headX) + (headY * headY) + (headZ * headZ));
                  if (dist < minDistance) {
                      minDistance = dist;
                      targetX = headX;
                      targetY = headY;
                      targetZ = headZ;
                      targetIndex = i;
                  }
              }
              if (targetIndex == -1) {
                  return;
              }
              uint64_t cameraPtr = base + 0x2B8C4C0;
              float *cameraPos = (float *)readMemory(cameraPtr, 12);
              if (cameraPos == NULL) {
                  return;
              }
              float camX = cameraPos[0];
              float camY = cameraPos[1];
              float camZ = cameraPos[2];
              float dx = targetX - camX;
              float dy = targetY - camY;
              float dz = targetZ - camZ;
              float yaw = atan2f(dy, dx);
              float pitch = atan2f(dz, sqrtf((dx * dx) + (dy * dy)));
              uint64_t viewAnglesPtr = base + 0x2B8C4E0;
              float currentYaw = 0.0f, currentPitch = 0.0f;
              float *viewAngles = (float *)readMemory(viewAnglesPtr, 8);
              if (viewAngles != NULL) {
                  currentYaw = viewAngles[0];
                  currentPitch = viewAngles[1];
              }
              float smoothYaw = (yaw - currentYaw) * 0.2f;
              float smoothPitch = (pitch - currentPitch) * 0.2f;
              float newYaw = currentYaw + smoothYaw;
              float newPitch = currentPitch + smoothPitch;
              float writeData[2] = {newYaw, newPitch};
              writeMemory(viewAnglesPtr, &writeData, 8);
          }

          void *aimLockThread(void *arg) {
              while (1) {
                  usleep(10000);
                  @autoreleasepool {
                      aimLock();
                  }
              }
              return NULL;
          }

          __attribute__((constructor)) void init() {
              taskPort = mach_task_self();
              pthread_t thread;
              pthread_create(&thread, NULL, aimLockThread, NULL);
              pthread_detach(thread);
          }
          EOF

      - name: Write Entitlements File
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.device.microphone</key>
              <true/>
              <key>com.apple.security.device.camera</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-only</key>
              <true/>
              <key>com.apple.security.files.user-selected.read-write</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Build Universal Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ARCH_FLAGS="-arch arm64"
          clang -dynamiclib \
                -arch arm64 \
                -isysroot $SDK_PATH \
                -framework Foundation \
                -framework UIKit \
                -framework CoreGraphics \
                -framework QuartzCore \
                -framework CoreMedia \
                -framework AVFoundation \
                -framework OpenGLES \
                -framework Metal \
                -framework MetalKit \
                -framework CoreImage \
                -framework CoreVideo \
                -framework CoreAudio \
                -framework AudioToolbox \
                -framework MediaPlayer \
                -framework GameController \
                -miphoneos-version-min=13.0 \
                -O3 \
                -Wall \
                -Werror \
                -current_version 1.0 \
                -compatibility_version 1.0 \
                -o libAimlock.dylib \
                Sources/Aimlock.m

      - name: Sign Binary
        run: |
          codesign --force --timestamp --entitlements entitlements.plist -s "Apple Development: " libAimlock.dylib

      - name: Verify Signature
        run: |
          codesign --verify libAimlock.dylib
          otool -L libAimlock.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libAimlock
          path: libAimlock.dylib
          retention-days: 7